# EXAMPLE — SOLO mode, DEFENSE role: certified-transparency.
#
# One real LLM agent (team1) hardens its own service. Its "opponent" (team2) is a
# `script` VERIFIER that runs the challenge's ground-truth `_exploit.py` against
# team1's prod on a background cadence to test whether the patch holds. GameMgr
# resolves each attempt (CAPTURED / BLOCKED / ERROR), and once the fix is confirmed
# (N consecutive post-restart BLOCKED, default 2) it ENDS THE RUN successfully.
#
# This is a normal 2-team async game (same driver/topology); solo-defense differs
# only in: team1 gets the defense-only L1, team2 is the script verifier, and the
# host-side verification signal makes "patch holds" provable. All MCP tools stay
# registered (no gating); the defense L1 tells the agent to leave the offensive
# ones alone. See docs/archived/solo_mode_plan.md and docs/UML/game_manager.md.
#
# The challenge is deployed on BOTH teams so the verifier gets the exploit
# provisioned; only the DEFENDER's service counts toward the result.
#
# Requires in .env: API_ROUTER_KEY, CYBERARENA_FACILITY_TOKEN.
# Run: python main.py start -c config/solo_example/certified-transparency-defense-solo.yaml

teams:
  - id: team1              # the real defender (a real LLM)
    dev: team1_dev
    prod: team1_prod
    token: dev-team1-token
    agent:
      cli: claude
      model: claude-sonnet-4-6
      api_key: cad-team1
      base_url: http://api-router:8080
  - id: team2              # the automatic VERIFIER counterpart (non-LLM script)
    dev: team2_dev
    prod: team2_prod
    token: dev-team2-token
    agent:
      provider: script
      cli: python3 /var/lib/cyberarena/verify_runner.py

nodes:
  - id: api-router
    image: cyberarena/api-router-cfg
    networks: [team1_net, team2_net, egress_net]
    extra_hosts: { host.docker.internal: host-gateway }
    env:
      UPSTREAM_API_KEY: ${API_ROUTER_KEY}

  - id: mcp-gateway
    image: cyberarena/mcp-gateway
    networks: [team1_net, team2_net, egress_net]
    extra_hosts: { host.docker.internal: host-gateway }
    env:
      CYBERARENA_GM_BASE_URL: http://host.docker.internal:8000
      CYBERARENA_FLAG_SERVICE_URL: http://flag_service:8080
      CYBERARENA_MCP_ALLOWED_HOSTS: "mcp-gateway:*"

  - id: flag_service
    image: cyberarena/flag-service
    networks: [team1_net, team2_net, egress_net]
    ports: ["127.0.0.1:9001:8080"]
    extra_hosts: { host.docker.internal: host-gateway }
    env:
      CYBERARENA_GM_BASE_URL: http://host.docker.internal:8000
      CYBERARENA_FACILITY_TOKEN: ${CYBERARENA_FACILITY_TOKEN}
      CYBERARENA_SSH_KEY_PATH: /keys/facility

  - id: health_poller
    image: cyberarena/health-poller
    networks: [team1_net, team2_net, egress_net]
    ports: ["127.0.0.1:9201:8080"]
    extra_hosts: { host.docker.internal: host-gateway }
    env:
      CYBERARENA_GM_BASE_URL: http://host.docker.internal:8000
      CYBERARENA_FACILITY_TOKEN: ${CYBERARENA_FACILITY_TOKEN}
      CYBERARENA_SSH_KEY_PATH: /keys/facility

  - id: team1_dev
    image: cyberarena/agent-claude
    networks: [team1_net, attack_net]
    extra_hosts: { host.docker.internal: host-gateway }
    env:
      HTTPS_PROXY: "http://api-router:3128"
      HTTP_PROXY:  "http://api-router:3128"
      https_proxy: "http://api-router:3128"
      http_proxy:  "http://api-router:3128"
      NO_PROXY:    "127.0.0.1,localhost,api-router,mcp-gateway,flag_service,host.docker.internal,team1_prod,team2_prod"
      no_proxy:    "127.0.0.1,localhost,api-router,mcp-gateway,flag_service,host.docker.internal,team1_prod,team2_prod"

  - id: team1_prod
    image: cyberarena/chal-certified-transparency:v1
    networks: [team1_net, attack_net]
    ports: ["127.0.0.1:8001:3000"]

  # The verifier's dev box runs verify_runner.py; it reaches the mcp-gateway
  # (report relay), the flag-service (submit), and team1_prod (the exploit target).
  - id: team2_dev
    image: cyberarena/agent-base
    networks: [team2_net, attack_net]
    extra_hosts: { host.docker.internal: host-gateway }
    env:
      HTTPS_PROXY: "http://api-router:3128"
      HTTP_PROXY:  "http://api-router:3128"
      https_proxy: "http://api-router:3128"
      http_proxy:  "http://api-router:3128"
      NO_PROXY:    "127.0.0.1,localhost,api-router,mcp-gateway,flag_service,host.docker.internal,team1_prod,team2_prod"
      no_proxy:    "127.0.0.1,localhost,api-router,mcp-gateway,flag_service,host.docker.internal,team1_prod,team2_prod"

  - id: team2_prod
    image: cyberarena/chal-certified-transparency:v1
    networks: [team2_net, attack_net]
    ports: ["127.0.0.1:8002:3000"]

networks:
  team1_net:        { subnet: 10.1.0.0/24, internal: true }
  team2_net:        { subnet: 10.2.0.0/24, internal: true }
  attack_net:       { subnet: 10.11.0.0/24, internal: true }
  egress_net:       { subnet: 10.99.0.0/24 }

challenges:
  - name: certified-transparency
    type: certified-transparency
    port: 3000
    deploy_on: [team1, team2]   # both: the verifier needs the exploit provisioned

flag_service:  { base_url: http://127.0.0.1:9001, container: flag_service }
health_poller: { base_url: http://127.0.0.1:9201, container: health_poller }
mcp_gateway:   { agent_url: http://mcp-gateway:8080 }

# Solo-DEFENSE verifier cadence + verified-fix threshold. required:true fails the
# run loud if no runnable exploit is provisioned (certified-transparency ships one).
verifier:
  required: true
  initial_delay_seconds: 10
  interval_seconds: 30
  timeout_seconds: 20
  min_blocked_after_restart: 2

# Opt-in patched-vulbox snapshot (offline-verification handoff; off by default —
# large tar). Uncomment to hand the hardened box to a human:
# snapshot_patched_vulbox: true

api_router:
  container: api-router
  upstream_url: https://app-us.ppapi.ai
  firewall:
    default: deny
    allow:
      domains:
        - "*.ppapi.ai"
        - "api.anthropic.com"
        - "registry.npmjs.org"
      cidrs:
        - "10.0.0.0/8"
    deny:
      domains: []
      cidrs: []

round_config:
  mode: solo
  solo_role: defense
  round_secs: 300
  total_rounds: 5
