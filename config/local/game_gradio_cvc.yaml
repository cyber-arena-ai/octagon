teams:
- id: team1
  dev: team1_dev
  prod: team1_prod
  token: dev-team1-token
  agent:
    cli: claude -p --dangerously-skip-permissions --output-format stream-json --verbose
    model: claude-sonnet-4-6
    api_key: ${ANTHROPIC_API_KEY_TEAM1}
    base_url: ${ANTHROPIC_BASE_URL_TEAM1}
- id: team2
  dev: team2_dev
  prod: team2_prod
  token: dev-team2-token
  agent:
    provider: codex
    cli: codex exec
    model: gpt-5.4
    api_key: ${CODEX_API_KEY_TEAM2}
    base_url: ${CODEX_BASE_URL_TEAM2}
nodes:
- id: team1_dev
  # cyberarena/agent-<provider>, not kali dev-base: the agent CLI is baked into the
  # image now (install() preflights them, it no longer npm-installs).
  image: cyberarena/agent-claude
  networks:
  - team1_net
  - attack_net_team1
  install_list: []
  extra_hosts:
    host.docker.internal: host-gateway
- id: team1_prod
  image: cyberarena/chal-gradio-lfi:v1
  networks:
  - team1_net
  - game_net
  - attack_net_team2
  ports:
  - 127.0.0.1:8001:7860
  install_list: []
- id: team2_dev
  # cyberarena/agent-<provider>, not kali dev-base: the agent CLI is baked into the
  # image now (install() preflights them, it no longer npm-installs).
  image: cyberarena/agent-codex
  networks:
  - team2_net
  - attack_net_team2
  install_list: []
  extra_hosts:
    host.docker.internal: host-gateway
- id: team2_prod
  image: cyberarena/chal-gradio-lfi:v1
  networks:
  - team2_net
  - game_net
  - attack_net_team1
  ports:
  - 127.0.0.1:8002:7860
  install_list: []
networks:
  team1_net:
    subnet: 10.1.0.0/24
  team2_net:
    subnet: 10.2.0.0/24
  game_net:
    subnet: 10.0.0.0/24
  attack_net_team1:
    subnet: 10.11.0.0/24
  attack_net_team2:
    subnet: 10.12.0.0/24
challenges:
- name: gradio-lfi
  type: gradio-lfi
  port: 7860
  deploy_on:
  - team1
  - team2
round_config:
  mode: async
  round_secs: 300
  total_rounds: 5
