# Cyber Arena — match configuration
# Combines teams + topology + challenges + round config for MVP.

teams:
  - id: team1
    dev: team1_dev
    prod: team1_prod
    # Dev token in plain yaml is fine for the local loop. Real matches put
    # tokens in .env via ${API_TEAM_TOKEN_TEAM1} and reference the placeholder
    # here (see gamemgr/config.py:_expand_env_vars).
    token: dev-team1-token
    agent:
      # Claude Code reads ANTHROPIC_BASE_URL + ANTHROPIC_API_KEY (set by
      # ClaudeAgentManager from api_key/base_url below). Pointing base_url at
      # a third-party router (e.g. ppapi.ai) routes all traffic through it.
      cli: claude -p --dangerously-skip-permissions --output-format stream-json --verbose
      model: claude-sonnet-4-6
      api_key: ${ANTHROPIC_API_KEY_TEAM1}
      base_url: ${ANTHROPIC_BASE_URL_TEAM1}
  - id: team2
    dev: team2_dev
    prod: team2_prod
    token: dev-team2-token
    agent:
      cli: claude -p --dangerously-skip-permissions --output-format stream-json --verbose
      model: claude-sonnet-4-6
      api_key: ${ANTHROPIC_API_KEY_TEAM2}
      base_url: ${ANTHROPIC_BASE_URL_TEAM2}

nodes:
  - id: team1_dev
    # cyberarena/agent-<provider>, not the older kali dev-base: the agent CLI is baked into
    # the image now (install() only preflights them, it no longer npm-installs), so
    # a dev image without `claude` on PATH fails the preflight.
    image: cyberarena/agent-claude
    networks: [team1_net]
    install_list: []
    # Resolve host.docker.internal to the host's gateway so the agent can
    # POST flag submissions back to the gameserver running on the host.
    extra_hosts:
      host.docker.internal: host-gateway

  - id: team1_prod
    image: cyberarena/chal-notes:v1
    networks: [team1_net, game_net]
    ports: ["127.0.0.1:8001:5000"]   # host loopback only — blocks container-via-gateway sidechannel
    install_list: []

  - id: team2_dev
    # cyberarena/agent-<provider>, not the older kali dev-base: the agent CLI is baked into
    # the image now (install() only preflights them, it no longer npm-installs), so
    # a dev image without `claude` on PATH fails the preflight.
    image: cyberarena/agent-claude
    networks: [team2_net]
    install_list: []
    extra_hosts:
      host.docker.internal: host-gateway

  - id: team2_prod
    image: cyberarena/chal-notes:v1
    networks: [team2_net, game_net]
    ports: ["127.0.0.1:8002:5000"]   # host loopback only — blocks container-via-gateway sidechannel
    install_list: []

networks:
  team1_net:
    subnet: 10.1.0.0/24
  team2_net:
    subnet: 10.2.0.0/24
  game_net:
    subnet: 10.0.0.0/24

challenges:
  - name: notes
    type: notes
    port: 5000
    deploy_on: [team1, team2]   # team ids; resolved to <team>_prod containers

round_config:
  defense_secs: 10
  attack_secs: 10
  total_rounds: 3